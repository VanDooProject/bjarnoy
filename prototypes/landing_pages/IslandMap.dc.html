<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ frame }}">
  <div style="{{ canvas }}">
    <sc-for list="{{ cells }}" as="c" hint-placeholder-count="30">
      <div style="{{ c.pos }}">
        <div style="{{ c.skirt }}"></div>
        <div style="{{ c.face }}"></div>
        <sc-if value="{{ c.plot }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;left:76px;top:172px;width:48px;height:34px;display:flex;align-items:center;justify-content:center;border:1.5px dashed rgba(255,255,255,.75);border-radius:8px;background:rgba(255,255,255,.14);font:600 18px Outfit,system-ui,sans-serif;color:#fff">+</div>
        </sc-if>
        <sc-if value="{{ c.art }}" hint-placeholder-val="{{ false }}">
          <img src="{{ c.art }}" style="{{ c.artStyle }}" />
        </sc-if>
      </div>
    </sc-for>
    <svg viewBox="0 0 1560 720" width="1560" height="720" style="position:absolute;left:0;top:0;z-index:8000;pointer-events:none;overflow:visible">
      <path d="{{ border }}" fill="none" stroke="rgba(255,197,92,.95)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <sc-for list="{{ mist }}" as="m" hint-placeholder-count="8">
      <div style="{{ m }}"></div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:820},&quot;zoom&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.6,&quot;min&quot;:0.2,&quot;max&quot;:1.4,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const TONE = { grass: ['#7ba844', '#4e6f2b'], sand: ['#e0c882', '#b39a58'], sea: ['#215a7a', '#143d55'] };
    const ART = {
      forest: 'tiles/forest.png', crop: 'tiles/farm-crop.png', pumpkin: 'tiles/farm-pumpkin.png',
      hut2: 'tiles/hut-l2.png', hut4: 'tiles/hut-l4.png',
      boat: 'tiles/sea-boat.png', rock: 'tiles/sea-rock.png',
    };
    const HEX = 'polygon(0px 50px, 50px 0px, 150px 0px, 200px 50px, 150px 100px, 50px 100px)';
    const SKIRT = 'polygon(0px 0px, 50px 50px, 150px 50px, 200px 0px, 200px 28px, 150px 78px, 50px 78px, 0px 28px)';

    // [col, row, terrain, art, claimed]
    const data = [
      [0, 1, 'sea'], [0, 2, 'sea'], [0, 3, 'sea'],
      [1, 0, 'sea'], [1, 1, 'sand'], [1, 2, 'sand'], [1, 3, 'sea'],
      [2, 0, 'sea'], [2, 1, 'grass', 'forest'], [2, 2, 'grass', null, 1], [2, 3, 'sand'],
      [3, 0, 'sand'], [3, 1, 'grass', 'crop', 1], [3, 2, 'grass', 'hut4', 1], [3, 3, 'grass', null, 1], [3, 4, 'sea'],
      [4, 0, 'sea'], [4, 1, 'grass', 'pumpkin', 1], [4, 2, 'grass', 'hut2', 1], [4, 3, 'sand'],
      [5, 0, 'sea'], [5, 1, 'sand'], [5, 2, 'grass', null, 1], [5, 3, 'sea'],
      [6, 1, 'sea', 'boat'], [6, 2, 'sea', 'rock'], [6, 3, 'sea'],
      [7, 1, 'sea'], [7, 2, 'sea'],
      [8, 0, 'sea'], [8, 1, 'grass', 'forest'], [8, 2, 'sand'],
      [9, 1, 'grass'], [9, 2, 'sea'],
    ];

    const cells = data.map(([q, r, terrain, art, claim]) => {
      const x = q * 150, y = r * 100 + (q % 2 ? 50 : 0);
      const [top, side] = TONE[terrain];
      return {
        pos: { position: 'absolute', left: x, top: y, width: 200, height: 300, zIndex: Math.round(y * 10 + q) },
        skirt: { position: 'absolute', left: 0, top: 190, width: 200, height: 78, background: side, clipPath: SKIRT },
        face: { position: 'absolute', left: 0, top: 140, width: 200, height: 100, background: top, clipPath: HEX },
        art: art ? ART[art] : null,
        artStyle: (art === 'boat' || art === 'rock')
          ? { position: 'absolute', left: -7.5, top: -21, width: 215, height: 322.5 }
          : { position: 'absolute', left: 0, top: 0, width: 200, height: 300 },
        plot: !!claim && !art,
      };
    });

    // one merged outline: only edges of claimed cells that face unclaimed ground
    const owned = new Set(data.filter(d => d[4]).map(d => d[0] + ',' + d[1]));
    const NB = q => q % 2
      ? { n: [0, -1], ne: [1, 0], se: [1, 1], s: [0, 1], sw: [-1, 1], nw: [-1, 0] }
      : { n: [0, -1], ne: [1, -1], se: [1, 0], s: [0, 1], sw: [-1, 0], nw: [-1, -1] };
    const EDGE = {
      n: [[50, 0], [150, 0]], ne: [[150, 0], [200, 50]], se: [[200, 50], [150, 100]],
      s: [[150, 100], [50, 100]], sw: [[50, 100], [0, 50]], nw: [[0, 50], [50, 0]],
    };
    let border = '';
    owned.forEach(key => {
      const [q, r] = key.split(',').map(Number);
      const ox = q * 150, oy = r * 100 + (q % 2 ? 50 : 0) + 140;
      const nb = NB(q);
      Object.keys(EDGE).forEach(dir => {
        if (owned.has((q + nb[dir][0]) + ',' + (r + nb[dir][1]))) return;
        const [a, b] = EDGE[dir];
        border += `M${ox + a[0]} ${oy + a[1]}L${ox + b[0]} ${oy + b[1]}`;
      });
    });

    const blob = (l, t, w, h, o) => ({
      position: 'absolute', left: l - w / 2, top: t - h / 2, width: w, height: h, zIndex: 9000, pointerEvents: 'none',
      opacity: o, filter: 'blur(30px)',
      background: 'radial-gradient(closest-side, rgba(238,247,251,.98) 0%, rgba(238,247,251,.86) 45%, rgba(238,247,251,0) 100%)',
    });
    const mist = [];
    const ring = (rx, ry, op) => {
      for (let a = 0; a < 360; a += 20) {
        const t = a * Math.PI / 180;
        mist.push(blob(620 + Math.cos(t) * rx, 390 + Math.sin(t) * ry, 520, 460, op));
      }
    };
    ring(700, 440, .92);
    ring(1000, 620, 1);
    ring(1320, 820, 1);

    const zoom = +this.props.zoom || 0.6;
    const frame = {
      position: 'relative', width: +this.props.w || '100%', height: +this.props.h || 820,
      background: 'radial-gradient(120% 100% at 40% 45%, #1f5877 0%, #123a52 60%, #0d2a3c 100%)',
      overflow: 'hidden',
    };
    const canvas = {
      position: 'absolute', left: '50%', top: '50%', width: 1560, height: 720,
      transformOrigin: '0 0', transform: `scale(${zoom}) translate(${-(+this.props.cx || 620)}px, ${-(+this.props.cy || 390)}px)`,
    };
    return { cells, mist, border, canvas, frame };
  }
}
</script>
</body>
</html>

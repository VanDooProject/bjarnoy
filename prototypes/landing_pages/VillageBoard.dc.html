<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ frame }}">
  <div style="{{ canvas }}">
    <sc-for list="{{ cells }}" as="c" hint-placeholder-count="14">
      <div style="{{ c.pos }}">
        <sc-if value="{{ c.solid }}" hint-placeholder-val="{{ true }}">
          <div style="{{ c.skirt }}"></div>
          <div style="{{ c.face }}"></div>
        </sc-if>
        <sc-if value="{{ c.art }}" hint-placeholder-val="{{ false }}">
          <img src="{{ c.art }}" style="{{ c.artStyle }}" />
        </sc-if>
        <sc-if value="{{ c.ring }}" hint-placeholder-val="{{ false }}">
          <div style="{{ c.ringOuter }}"></div>
          <div style="{{ c.ringInner }}"></div>
        </sc-if>
        <sc-if value="{{ c.label }}" hint-placeholder-val="{{ false }}">
          <div style="{{ c.labelStyle }}">{{ c.label }}</div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:460},&quot;preset&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;shore&quot;,&quot;feast&quot;,&quot;grow&quot;],&quot;default&quot;:&quot;shore&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;zoom&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.6,&quot;min&quot;:0.2,&quot;max&quot;:1.2,&quot;step&quot;:0.02,&quot;tsType&quot;:&quot;number&quot;},&quot;cx&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:480,&quot;tsType&quot;:&quot;number&quot;},&quot;cy&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:300,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const ART = { forest: 'tiles/forest.png', crop: 'tiles/farm-crop.png', pumpkin: 'tiles/farm-pumpkin.png',
      hut2: 'tiles/hut-l2.png', hut4: 'tiles/hut-l4.png', boat: 'tiles/sea-boat.png', rock: 'tiles/sea-rock.png' };
    const TONE = { grass: ['#5b9128', '#ae7330'], sand: ['#ddc37e', '#c7a35c'], sea: ['#1c3650', '#14283c'] };
    const HEX = 'polygon(0px 46px, 50px 0px, 150px 0px, 200px 46px, 150px 92px, 50px 92px)';
    const SKIRT = 'polygon(0px 0px, 50px 46px, 150px 46px, 200px 0px, 200px 28px, 150px 74px, 50px 74px, 0px 28px)';
    const HEXIN = 'polygon(0px 41.4px, 45px 0px, 135px 0px, 180px 41.4px, 135px 82.8px, 45px 82.8px)';

    // [q, r, terrain, art, ring, label]
    const PRESETS = {
      shore: [
        [0,1,'grass','forest'], [0,2,'sand'],
        [1,0,'grass','hut4'], [1,1,'grass','crop'], [1,2,'grass'], [1,3,'sand'],
        [2,0,'grass','forest'], [2,1,'grass','hut2'], [2,2,'grass'], [2,3,'sand'],
        [3,0,'grass','pumpkin'], [3,1,'grass'], [3,2,'sand','', '#ffc55c', 'Wall goes here'], [3,3,'sea'],
        [4,0,'grass','forest'], [4,1,'sand'], [4,2,'sea'],
        [5,1,'sea','boat','', 'Grimhold, 3 turns out'], [5,2,'sea','boat'], [6,1,'sea','boat'],
      ],
      feast: [
        [0,1,'grass','forest'], [0,2,'grass'],
        [1,0,'grass','forest'], [1,1,'grass','crop','#8fc35a','Pumpkin bread'], [1,2,'grass'], [1,3,'sand'],
        [2,0,'grass','pumpkin'], [2,1,'grass','hut2'], [2,2,'grass','', '#ffc55c', 'Roast the ox'], [2,3,'sand'],
        [3,0,'grass','hut4'], [3,1,'grass','forest'], [3,2,'sand'],
        [4,0,'grass'], [4,1,'sand'], [4,2,'sea','boat','#7fb3d5','Fish stew'],
      ],
      grow: [
        [0,1,'grass','forest'], [0,2,'grass'],
        [1,0,'grass','crop'], [1,1,'grass','hut2'], [1,2,'grass','', '#ffc55c', '+4 grain'], [1,3,'sand'],
        [2,0,'grass','forest'], [2,1,'grass','hut4'], [2,2,'grass','', '#ffc55c', '+2 wood'], [2,3,'sand'],
        [3,0,'grass','pumpkin'], [3,1,'grass','hut4'], [3,2,'grass'], [3,3,'sea'],
        [4,0,'grass','forest'], [4,1,'grass','', '#ffc55c', 'Tap'], [4,2,'sand'],
        [5,1,'sand'], [5,2,'sea'],
      ],
    };
    const data = PRESETS[this.props.preset || 'shore'] || PRESETS.shore;

    const cells = data.map(([q, r, terrain, art, ring, label]) => {
      const x = q * 150, y = r * 92 + (q % 2 ? 46 : 0);
      const [top, sideL] = TONE[terrain];
      const water = art === 'boat' || art === 'rock';
      return {
        pos: { position: 'absolute', left: x, top: y, width: 200, height: 300, zIndex: Math.round(y * 10 + q) },
        solid: true,
        skirt: { position: 'absolute', left: 0, top: 185, width: 200, height: 74, background: sideL, clipPath: SKIRT },
        face: { position: 'absolute', left: 0, top: 139, width: 200, height: 92, background: top, clipPath: HEX },
        art: art ? ART[art] : null,
        artStyle: { position: 'absolute', left: 0, top: water ? -11 : 0, width: 200, height: 300 },
        ring: ring || null,
        ringOuter: { position: 'absolute', left: 0, top: 139, width: 200, height: 92, background: ring || 'transparent', clipPath: HEX, zIndex: 3 },
        ringInner: { position: 'absolute', left: 10, top: 143.6, width: 180, height: 82.8, background: top, clipPath: HEXIN, zIndex: 4 },
        label: label || null,
        labelStyle: {
          position: 'absolute', left: 100, top: 132, transform: 'translate(-50%,-100%)', zIndex: 60,
          padding: '6px 13px', borderRadius: 999, whiteSpace: 'nowrap',
          background: ring || 'rgba(8,20,28,.92)', color: ring ? '#20160a' : '#fff',
          font: '600 15px Outfit, system-ui, sans-serif',
        },
      };
    });

    const zoom = +this.props.zoom || 0.6;
    const frame = { position: 'relative', width: +this.props.w || '100%', height: +this.props.h || 460, overflow: 'hidden' };
    const canvas = {
      position: 'absolute', left: '50%', top: '50%', width: 1400, height: 700, transformOrigin: '0 0',
      transform: `scale(${zoom}) translate(${-(+this.props.cx || 480)}px, ${-(+this.props.cy || 300)}px)`,
    };
    return { cells, frame, canvas };
  }
}
</script>
</body>
</html>

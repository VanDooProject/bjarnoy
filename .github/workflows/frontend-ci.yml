name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: src/frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bg_assets_hextile is a separate private repo, so the default
      # GITHUB_TOKEN (scoped to this repo only) can't clone it — a bare
      # `git submodule update` hits "Repository not found". Route that one
      # URL through a PAT with read access to it instead.
      - run: git config --global url."https://x-access-token:${ASSETS_REPO_TOKEN}@github.com/VanDooProject/bg_assets_hextile".insteadOf "https://github.com/VanDooProject/bg_assets_hextile"
        env:
          ASSETS_REPO_TOKEN: ${{ secrets.ASSETS_REPO_TOKEN }}

      # Scoped to just the submodule this build needs, rather than
      # `actions/checkout`'s `submodules: true` (which recurses over every
      # submodule in the whole monorepo, including unrelated ones under
      # legacy/). Path is relative to the repo root (not this job's
      # `working-directory: src/frontend` default) since git resolves
      # submodule pathspecs from the top of the working tree.
      - run: git submodule update --init --depth 1 -- vendor/bg_assets_hextile

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Typecheck & build
        run: npm run build

  # See docs/ci/e2e-sharding.md for the full story of how this job's split
  # was chosen (plain --shard, why it was uneven, and how these 4 groups
  # were measured and balanced).
  #
  # 4 duration-tagged groups instead of plain --shard=N/4: --shard splits
  # the test list contiguously in file-discovery (alphabetical) order, not
  # by duration, and this suite's heaviest specs sort together
  # alphabetically — an earlier plain 3-way shard dumped nearly all of them
  # into one shard (14min) while the others sat idle; even 6-way still left
  # one shard at 8.5min against a ~2min fastest. Every test in the suite
  # carries at most one of the @g1/@g2/@g3 tags (see the individual spec
  # files); "rest" runs everything NOT carrying one of those tags via
  # --grep-invert, so it is the safety net — a newly added spec file that
  # nobody tags still runs (in "rest"), it just isn't guaranteed to be
  # perfectly balanced until someone tags it. Groups were bin-packed by
  # hand against real per-file CI durations (see the doc) to land within
  # ~35s of each other; re-measure and re-tag if the suite's shape changes
  # significantly (e.g. a new consistently-slow spec file).
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: g1
            args: --grep @g1
          - name: g2
            args: --grep @g2
          - name: g3
            args: --grep @g3
          - name: rest
            args: --grep-invert "@g1|@g2|@g3"
    steps:
      - uses: actions/checkout@v4

      # See the build job's identical steps for why: bg_assets_hextile is a
      # private repo needing a PAT, and the submodule pathspec is relative
      # to the repo root, not this job's working-directory default.
      - run: git config --global url."https://x-access-token:${ASSETS_REPO_TOKEN}@github.com/VanDooProject/bg_assets_hextile".insteadOf "https://github.com/VanDooProject/bg_assets_hextile"
        env:
          ASSETS_REPO_TOKEN: ${{ secrets.ASSETS_REPO_TOKEN }}

      - run: git submodule update --init --depth 1 -- vendor/bg_assets_hextile

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: E2E tests
        run: npx playwright test ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}
          path: |
            src/frontend/playwright-report/
            src/frontend/test-results/
          retention-days: 7

name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: src/frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scoped to just the submodule this build needs, rather than
      # `actions/checkout`'s `submodules: true` (which recurses over every
      # submodule in the whole monorepo, including unrelated ones under
      # legacy/).
      - run: git submodule update --init --depth 1 -- src/frontend/vendor/bg_assets_hextile

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

      - name: Typecheck & build
        run: npm run build

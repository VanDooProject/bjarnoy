name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: src/frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scoped to just the submodule this build needs, rather than
      # `actions/checkout`'s `submodules: true` (which recurses over every
      # submodule in the whole monorepo, including unrelated ones under
      # legacy/).
      - run: git submodule update --init --depth 1 -- src/frontend/vendor/bg_assets_hextile

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Typecheck & build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: git submodule update --init --depth 1 -- src/frontend/vendor/bg_assets_hextile

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            src/frontend/playwright-report/
            src/frontend/test-results/
          retention-days: 7

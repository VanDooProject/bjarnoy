name: E2E Self-Hosted Runner Benchmark

# One-off, manually-triggered comparison of the frontend e2e suite's
# heaviest shard (@g3, the group frontend-ci.yml's own docs/ci/e2e-sharding.md
# consistently measures as the straggler) on GitHub's hosted ubuntu-latest
# vs. the org's self-hosted runner, to see whether self-hosting is worth
# adopting for frontend-ci.yml's e2e job. Not wired into push/pull_request —
# dispatch it by hand when a comparison is needed.
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: src/frontend

jobs:
  e2e-benchmark:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, self-hosted]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # See frontend-ci.yml's identical steps: bg_assets_hextile is a
      # private repo needing a PAT, and the submodule pathspec is relative
      # to the repo root, not this job's working-directory default.
      - run: git config --global url."https://x-access-token:${ASSETS_REPO_TOKEN}@github.com/VanDooProject/bg_assets_hextile".insteadOf "https://github.com/VanDooProject/bg_assets_hextile"
        env:
          ASSETS_REPO_TOKEN: ${{ secrets.ASSETS_REPO_TOKEN }}

      - run: git submodule update --init --depth 1 -- vendor/bg_assets_hextile

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: E2E tests (@g3 shard)
        run: npx playwright test --grep @g3

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-benchmark-${{ matrix.runner }}
          path: |
            src/frontend/playwright-report/
            src/frontend/test-results/
          retention-days: 7

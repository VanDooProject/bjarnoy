name: E2E Self-Hosted Runner Benchmark

# One-off timing of the frontend e2e suite's heaviest shard (@g3, the group
# frontend-ci.yml's own docs/ci/e2e-sharding.md consistently measures as the
# straggler) on the org's self-hosted runner, to compare against
# ubuntu-latest's already-measured @g3 baseline (13m00s-14m05s across recent
# frontend-ci.yml runs on main) and decide whether self-hosting is worth
# adopting for frontend-ci.yml's e2e job.
#
# Triggers only on a pull_request that touches this file, so it runs once
# on the PR that adds/edits it rather than becoming a standing job on every
# PR — this is a same-repo branch, not a fork, so a self-hosted runner here
# carries none of the fork-PR privilege-escalation risk.
on:
  pull_request:
    paths:
      - '.github/workflows/e2e-selfhosted-benchmark.yml'

defaults:
  run:
    working-directory: src/frontend

jobs:
  e2e-benchmark:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # See frontend-ci.yml's identical steps: bg_assets_hextile is a
      # private repo needing a PAT, and the submodule pathspec is relative
      # to the repo root, not this job's working-directory default.
      - run: git config --global url."https://x-access-token:${ASSETS_REPO_TOKEN}@github.com/VanDooProject/bg_assets_hextile".insteadOf "https://github.com/VanDooProject/bg_assets_hextile"
        env:
          ASSETS_REPO_TOKEN: ${{ secrets.ASSETS_REPO_TOKEN }}

      - run: git submodule update --init --depth 1 -- vendor/bg_assets_hextile

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: E2E tests (@g3 shard)
        run: npx playwright test --grep @g3

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-benchmark-self-hosted
          path: |
            src/frontend/playwright-report/
            src/frontend/test-results/
          retention-days: 7

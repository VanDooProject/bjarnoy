
<h2>Map Component</h2>


<svg>
    <!-- define a blue gradient for the sea of the map -->
    <defs>
        <linearGradient id="seaGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" style="stop-color:rgb(82, 82, 235);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgb(43, 43, 202);stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- create the background -->
    <rect width="100%" height="100%" fill="url(#seaGradient)" />



    <!-- loop over our tile list -->
    

    <g app-tile ></g>


    <!-- create a hexagon outline for the tile -->
     <g transform="translate(50, 185)">
        <polygon points="0,0 50,50 150,50 200,0 150,-50 150,-50 50,-50 0,0"
        fill="none" stroke="orange" stroke-width="3" />
     </g>
     <g transform="translate(50, 285)">
        <polyline points="50,-50 0,0 50,50 150,50 200,0 150,-50 "
        fill="none" stroke="red" stroke-width="3" />
     </g>


    <rect width="50" height="50" x="500" y="500" rx="10" ry="10" fill="blue" />
</svg>

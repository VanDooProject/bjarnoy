<svg:g [attr.transform]="transform">
    <image
        [attr.x]="0"
        [attr.y]="0"
        [attr.width]="width"
        [attr.height]="height"
        [attr.xlink:href]="href"
    ></image>

    <text [attr.x]="width / 2" [attr.y]="155" dy=".3em" text-anchor="middle" fill="white">
        <tspan [attr.x]="width / 2" dy="1.2em">{{ label }}</tspan>
        <tspan [attr.x]="width / 2" dy="1.2em">{{src}}</tspan>
        <tspan [attr.x]="width / 2" dy="1.2em">{{color}}</tspan>
    </text>



    <g transform="translate(0, 186)">
        <!-- <polyline points="50,-46 0,0 50,46 150,46 200,0 150,-46"
    	fill="none" stroke="orange" stroke-width="1" /> -->
        <polyline points="0,0 50,46 150,46 200,0"
    	fill="none" stroke="lightgrey" stroke-width="1" />
    </g>
    

    
    <!-- <ng-template *ngIf="color != null"> -->
    <!-- <ng-template [ngIf]="color != null"> -->
    <!-- <ng-template [ngIf]="true == true"> -->
    <!-- <ng-template *ngIf="true == true"> -->
        <svg:g transform="translate(0, 184)" *ngIf="color != null">
            <polyline points="0,0 50,46 150,46 200,0"
            fill="none" [attr.stroke]="color" stroke-width="3" />
        </g>
    <!-- </ng-template> -->
</g>

    
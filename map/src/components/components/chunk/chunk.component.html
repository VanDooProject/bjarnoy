<p>chunk works! ({{ baseCoordX }}|{{ baseCoordY }}) with tiles {{ tiles.length }}</p>



<svg
  [attr.width]="chunkWidth"
  [attr.height]="chunkHeight"
  xmlns="http://www.w3.org/2000/svg"
  *ngFor="let tileRow of tiles"
  >

    <g app-tile 
      *ngFor="let tile of tileRow"
      [tile]="tile"
      >
	</g>
    
</svg>

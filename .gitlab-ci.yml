variables:
  DOCKER_REG: gitlab.mynode.space:1443

  GIT_SUBMODULE_STRATEGY: recursive # needed for heatmap npm / vue package

stages:
  - build

build:
  image: node:22
  stage: build

  cache:
    paths:
      - map/node_modules/

  script:
    - cd ./map
    - npm install
    - npm run build
  artifacts:
    paths:
      - map/dist/

.test:
  image: node:22
  stage: build

  variables:
    CI: "true"

  cache:
    paths:
      - map/node_modules/

  services:
    - name: selenium/standalone-chrome
      alias: browser

  script:
    - cd ./map
    - npm install

    # maybe we need an image with chrome for these tests to work
    # Use the --no-browsers command line option to override the value of this setting specified in the configuration file with an empty list.
    #- npm run test --sourceMap=false --no-browsers --browsers=ChromeHeadless --watch=false
    # TODO set remote browser to docker container service
    #- npm run test --sourceMap=false --no-browsers --browsers=ChromeHeadless --watch=false --single-run --verbose
    # `test2` has watch disabled
    - npm run test2 --sourceMap=false --no-browsers --browsers=ChromeHeadless --verbose

variables:
  DOCKER_REG: gitlab.mynode.space:1443

  GIT_SUBMODULE_STRATEGY: recursive # needed for heatmap npm / vue package

stages:
  - build

build:
  image: node:22
  stage: build

  cache:
    paths:
      - map/node_modules/

  script:
    - cd ./map
    - npm install
    - npm run build

    # maybe we need an image with chrome for these tests to work
    - ng test --sourceMap=false --browsers=ChromeHeadless --watch=false
  artifacts:
    paths:
      - map/dist/
